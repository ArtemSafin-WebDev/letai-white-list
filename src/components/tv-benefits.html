<section class="tv-benefits" aria-label="Преимущества Летай ТВ">
  <article class="tv-benefits__card">
    <picture>
      <source
        media="(max-width: 767px)"
        srcset="/assets/tv-benefits/archive-background-mobile.png"
      />
      <img
        class="tv-benefits__background"
        src="/assets/tv-benefits/archive-background.png"
        alt=""
        aria-hidden="true"
        loading="lazy"
        decoding="async"
      />
    </picture>

    <div class="tv-benefits__copy">
      <h2 class="tv-benefits__title">Смотрите в удобное время</h2>
      <p class="tv-benefits__description">
        Более 900 любимых программ и фильмов доступны в записи после эфира
      </p>
    </div>
  </article>

  <article class="tv-benefits__card">
    <picture>
      <source
        media="(max-width: 767px)"
        srcset="/assets/tv-benefits/recommendations-background-mobile.png"
      />
      <img
        class="tv-benefits__background"
        src="/assets/tv-benefits/recommendations-background.png"
        alt=""
        aria-hidden="true"
        loading="lazy"
        decoding="async"
      />
    </picture>

    <div class="tv-benefits__copy">
      <h2 class="tv-benefits__title">
        Включайте подборки по похожим фильмам<br />
        и сериалам
      </h2>
      <p class="tv-benefits__description">
        Находите похожие истории<br class="tv-benefits__desktop-break" />
        и открывайте новое
      </p>
    </div>
  </article>
</section>
