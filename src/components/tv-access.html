<section class="tv-access" aria-label="Способы смотреть Летай ТВ">
  <article class="tv-access__card tv-access__card--smart-tv">
    <img
      class="tv-access__gradient tv-access__gradient--smart-tv"
      src="/assets/tv-smart-gradient.svg"
      alt=""
      aria-hidden="true"
    />

    <div class="tv-access__copy tv-access__copy--smart-tv">
      <h2 class="tv-access__title">
        Смотрите<br />
        на большом экране
      </h2>
      <p class="tv-access__description">Пошаговые инструкции для вашего Smart TV</p>

      <div class="tv-access__models">
        <p class="tv-access__models-label">Выберите и нажмите на кнопку вашей модели:</p>
        <div class="tv-access__model-list" aria-label="Модели Smart TV">
          <button class="tv-access__model" type="button" aria-label="Инструкция для телевизоров LG">
            <img class="tv-access__model-logo tv-access__model-logo--lg" src="/assets/tv-brand-lg.png" alt="LG" />
            <span aria-hidden="true">→</span>
          </button>
          <button class="tv-access__model" type="button" aria-label="Инструкция для телевизоров Samsung">
            <img class="tv-access__model-logo tv-access__model-logo--samsung" src="/assets/tv-brand-samsung.svg" alt="Samsung" />
            <span aria-hidden="true">→</span>
          </button>
          <button class="tv-access__model" type="button" aria-label="Инструкция для телевизоров Haier">
            <img class="tv-access__model-logo tv-access__model-logo--haier" src="/assets/tv-brand-haier.png" alt="Haier" />
            <span aria-hidden="true">→</span>
          </button>
          <button class="tv-access__model" type="button" aria-label="Инструкция для телевизоров TCL">
            <img class="tv-access__model-logo tv-access__model-logo--tcl" src="/assets/tv-brand-tcl.png" alt="TCL" />
            <span aria-hidden="true">→</span>
          </button>
          <button class="tv-access__model" type="button" aria-label="Инструкция для телевизоров Xiaomi">
            <img class="tv-access__model-logo tv-access__model-logo--mi" src="/assets/tv-brand-mi.png" alt="Xiaomi" />
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </div>

    <picture class="tv-access__smart-tv-picture">
      <source media="(max-width: 767px)" srcset="/assets/tv-screen-mobile.png" />
      <img
        class="tv-access__smart-tv-image"
        src="/assets/tv-screen-desktop.png"
        alt="Телевизор с фильмом Летай ТВ на экране"
        width="1864"
        height="1106"
        loading="lazy"
        decoding="async"
      />
    </picture>
  </article>

  <article class="tv-access__card tv-access__card--box">
    <img
      class="tv-access__gradient tv-access__gradient--box"
      src="/assets/tv-box-gradient.svg"
      alt=""
      aria-hidden="true"
    />

    <div class="tv-access__copy tv-access__copy--box">
      <h2 class="tv-access__title">ТВ-приставки</h2>
      <p class="tv-access__description">Для телевизоров без смарт ТВ</p>
    </div>

    <img
      class="tv-access__box-image"
      src="/assets/tv-set-top-box.png"
      alt="ТВ-приставка Летай"
      width="698"
      height="698"
      loading="lazy"
      decoding="async"
    />

    <div class="tv-access__purchase">
      <p class="tv-access__price-label">Цена:</p>
      <p class="tv-access__price">4000 ₽</p>
      <div class="tv-access__purchase-actions">
        <a class="tv-access__action tv-access__action--primary" href="#callback-form-title">Купить</a>
        <a class="tv-access__action tv-access__action--secondary" href="#callback-form-title">
          В аренду за 150 ₽ / мес
        </a>
      </div>
    </div>
  </article>

  <article class="tv-access__card tv-access__card--app">
    <h2 class="tv-access__title tv-access__app-title">
      Установите мобильное<br class="tv-access__app-title-break" />
      приложение «Летай ТВ»
    </h2>

    <div class="tv-access__stores" aria-label="Магазины приложений">
      <a
        class="tv-access__store"
        href="https://letai.ru/arkhiv/appletaitv/?utm_source=landing&amp;utm_medium=internal&amp;utm_campaign=app-store"
        target="_blank"
        rel="noreferrer"
        aria-label="Скачать Летай ТВ в App Store"
      >
        <img src="/assets/store-apple.svg" alt="" />
      </a>
      <a
        class="tv-access__store"
        href="https://letai.ru/arkhiv/appletaitv/?utm_source=landing&amp;utm_medium=internal&amp;utm_campaign=google-play"
        target="_blank"
        rel="noreferrer"
        aria-label="Скачать Летай ТВ в Google Play"
      >
        <img src="/assets/store-google-play.svg" alt="" />
      </a>
      <a
        class="tv-access__store"
        href="https://letai.ru/arkhiv/appletaitv/?utm_source=landing&amp;utm_medium=internal&amp;utm_campaign=appgallery"
        target="_blank"
        rel="noreferrer"
        aria-label="Скачать Летай ТВ в AppGallery"
      >
        <img src="/assets/store-appgallery.svg" alt="" />
      </a>
      <a
        class="tv-access__store"
        href="https://letai.ru/arkhiv/appletaitv/?utm_source=landing&amp;utm_medium=internal&amp;utm_campaign=rustore"
        target="_blank"
        rel="noreferrer"
        aria-label="Скачать Летай ТВ в RuStore"
      >
        <img src="/assets/store-rustore.svg" alt="" />
      </a>
    </div>

    <img
      class="tv-access__qr"
      src="/assets/tv-app-qr.svg"
      alt="QR-код для установки приложения Летай ТВ"
      width="183"
      height="183"
      loading="lazy"
      decoding="async"
    />
  </article>
</section>
