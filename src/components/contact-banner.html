<section class="contact-banner" aria-labelledby="contact-banner-title">
  <picture class="contact-banner__picture" aria-hidden="true">
    <source
      media="(max-width: 767px)"
      srcset="/assets/contact-banner-mobile.webp"
      type="image/webp"
    />
    <source srcset="/assets/contact-banner-desktop.webp" type="image/webp" />
    <img
      src="/assets/contact-banner-desktop.webp"
      alt=""
      width="3000"
      height="1040"
      loading="lazy"
      decoding="async"
    />
  </picture>

  <div class="contact-banner__content">
    <div class="contact-banner__copy">
      <h2 class="contact-banner__title" id="contact-banner-title">
        ОСТАВАЙТЕСЬ НА СВЯЗИ С ЛЕТАЙ
      </h2>
      <p class="contact-banner__description">
        Наши специалисты перезвонят Вам и помогут подобрать лучшее решение
      </p>
    </div>

    <button class="contact-banner__button" type="button" data-lead-modal-open>
      Оставить заявку
    </button>
  </div>
</section>
