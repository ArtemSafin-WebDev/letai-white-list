<div class="lead-modal" aria-hidden="true" data-lead-modal>
  <div
    class="lead-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="lead-modal-title"
    tabindex="-1"
    data-lead-modal-dialog
  >
    <button
      class="lead-modal__close"
      type="button"
      aria-label="Закрыть форму"
      data-lead-modal-close
    >
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>

    <div class="lead-modal__form-view" data-lead-form-view>
      <h2 class="lead-modal__title" id="lead-modal-title">
        Оставьте свой номер и мы свяжемся с Вами в ближайшее время.
      </h2>

      <form
        class="lead-modal__form"
        action="/bitrix/services/main/ajax.php?mode=class&amp;c=tattelecom%3Aform&amp;action=sendLead"
        method="post"
        novalidate
        data-lead-form
      >
        <div class="lead-modal__fields">
          <label class="lead-modal__field">
            <span class="visually-hidden">Ваше имя</span>
            <input
              class="lead-modal__input"
              type="text"
              name="firstname"
              autocomplete="name"
              placeholder="Ваше имя"
              aria-describedby="lead-name-error"
              data-lead-name
              data-lead-modal-autofocus
            />
            <span
              class="lead-modal__field-error"
              id="lead-name-error"
              data-lead-error="name"
            ></span>
          </label>

          <label class="lead-modal__field">
            <span class="visually-hidden">Номер телефона</span>
            <input
              class="lead-modal__input"
              type="tel"
              name="phone"
              autocomplete="tel"
              inputmode="tel"
              placeholder="+7 (___) ___-__-__"
              aria-describedby="lead-phone-error"
              data-lead-phone
            />
            <span
              class="lead-modal__field-error"
              id="lead-phone-error"
              data-lead-error="phone"
            ></span>
          </label>
        </div>

        <div class="lead-modal__consent-wrapper">
          <label class="lead-modal__consent" data-lead-consent-label>
            <input
              class="lead-modal__checkbox"
              type="checkbox"
              name="modal-callback-agree"
              aria-describedby="lead-consent-error"
              data-lead-consent
            />
            <span class="lead-modal__checkbox-control" aria-hidden="true">
              <svg viewBox="0 0 16 16" focusable="false">
                <path d="m3.2 8.3 3 3 6.6-6.6" />
              </svg>
            </span>
            <span class="lead-modal__consent-text">
              Я согласен на
              <a href="https://letai.ru/app/personaldata/" target="_blank" rel="noreferrer">
                обработку своих персональных данных
              </a>
            </span>
          </label>
          <span
            class="lead-modal__field-error lead-modal__consent-error"
            id="lead-consent-error"
            data-lead-error="consent"
          ></span>
        </div>

        <p class="lead-modal__submit-error" role="alert" hidden data-lead-submit-error></p>

        <button class="lead-modal__submit" type="submit" data-lead-submit>
          <span data-lead-submit-label>Жду звонка</span>
          <span class="lead-modal__spinner" aria-hidden="true"></span>
        </button>

        <p class="lead-modal__legal">
          Нажимая кнопку, вы соглашаетесь на обработку персональных данных<br />
          Защита от спама SmartCaptcha
          <a
            href="https://yandex.ru/legal/smartcaptcha_notice/ru/"
            target="_blank"
            rel="noreferrer"
          >Условия использования</a>.
        </p>

        <div class="lead-modal__captcha" data-lead-captcha></div>
      </form>
    </div>

    <div class="lead-modal__success" aria-live="polite" hidden data-lead-success>
      <svg class="lead-modal__success-background" viewBox="0 0 529 184" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="1.22">
          <path d="M-12.7 169.9s34.5 19.4 173.5-7.1c93.6-17.8 104-33.4 185.9-31.4 136.3 3.5 303.1 84.1 303.1 84.1" />
          <path d="M-11.8 162.3s40.9 20 168.5-4.7c121.4-23.5 129.6-35.7 178.2-37.3 128.8-4.4 279.8 54.8 295.1 56" />
          <path d="M-10.9 154.7s47.2 20.7 163.5-2.3c107.6-21.3 119.8-38.9 171.6-43.3 121.4-12.6 256.4 25.5 287.1 28.1" />
          <path d="M-10 147.2s53.6 21.3 158.6 0c96.7-19.7 109.7-42.3 164.3-49.3C426.9 76.6 546 94.1 592 98" />
          <path d="M-9.1 139.6s60 22 153.6 2.4c85.5-18 99.8-45.9 157.2-55.2C408.1 56.1 511.4 53.7 572.7 58.8" />
          <path d="M-8.2 132s104.2 35.6 213.5-17.8C338.8 49.1 455.4 11.4 553.4 19.7" />
        </g>
      </svg>
      <h2 class="lead-modal__success-title">Спасибо!</h2>
      <div class="lead-modal__success-icon" aria-hidden="true">
        <svg viewBox="0 0 46 42" focusable="false">
          <path d="M30.5 2C36.5.2 41.6 3.2 43.4 6.8c2.5 5.1 1.5 10.9-3.2 17.4-3.7 5.1-9 10.2-16.7 16.2a.9.9 0 0 1-1.1 0C14.8 34.4 9.5 29.2 5.8 24.2 1.1 17.8.1 12 2.6 6.8 4.4 3.2 9.5.2 15.5 2 18.4 2.8 20.9 4.6 22.6 7l.4.6.4-.6c1.7-2.4 4.2-4.2 7.1-5Z" />
        </svg>
      </div>
      <div class="lead-modal__success-text">
        <div>Ваша заявка принята в обработку.</div>
        <div>Мы свяжемся с вами в ближайшее время.</div>
      </div>
    </div>
  </div>
</div>
