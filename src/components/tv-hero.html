<section class="tv-hero" aria-labelledby="tv-hero-title">
  <picture class="tv-hero__picture">
    <source
      media="(max-width: 767px)"
      srcset="/assets/tv-hero/tv-hero-mobile.png"
    />
    <img
      class="tv-hero__image"
      src="/assets/tv-hero/tv-hero-desktop.png"
      width="3097"
      height="1074"
      alt="Домашний просмотр фильмов и сериалов с Летай ТВ"
      fetchpriority="high"
      decoding="async"
    />
  </picture>

  <div class="tv-hero__content">
    <div class="tv-hero__copy">
      <h1 class="tv-hero__title" id="tv-hero-title">Включайте Летай ТВ</h1>
      <p class="tv-hero__description">
        Смотрите каналы, фильмы и сериалы в одном приложении
      </p>
    </div>

    <a class="tv-hero__button" href="#callback-form-title">Подключиться</a>
  </div>
</section>
