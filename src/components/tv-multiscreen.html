<section class="tv-multiscreen" aria-labelledby="tv-multiscreen-title">
  <div class="tv-multiscreen__card">
    <img
      class="tv-multiscreen__shade"
      src="/assets/tv-multiscreen/shade.svg"
      alt=""
      aria-hidden="true"
    />

    <picture>
      <source
        media="(max-width: 767px)"
        srcset="/assets/tv-multiscreen/glow-mobile.svg"
      />
      <img
        class="tv-multiscreen__glow"
        src="/assets/tv-multiscreen/glow-desktop.svg"
        alt=""
        aria-hidden="true"
      />
    </picture>

    <img
      class="tv-multiscreen__devices"
      src="/assets/tv-multiscreen/devices.png"
      alt="Телевизор, планшет и смартфон с синхронизированным просмотром фильма"
      width="1173"
      height="839"
      loading="lazy"
      decoding="async"
    />

    <div class="tv-multiscreen__copy">
      <h2 class="tv-multiscreen__title" id="tv-multiscreen-title">
        Смотрите где удобно
      </h2>
      <p class="tv-multiscreen__description">
        Начните на телевизоре и продолжите на смартфоне или планшете с того же места
      </p>
    </div>
  </div>
</section>
